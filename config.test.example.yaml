# A 15-minute version of the whole schedule, for trying the bot out:
#   halfway report at 7.5 min, warnings at 5 min and 2 min left, final report at 15 min.
# cp config.test.example.yaml config.test.yaml, put your own email/name in members, then run:
#   python -m bot.main --config config.test.yaml
watch_channel: bot-test
reminder_channel: bot-test
emojis: [scream]
members:
  - YOUR EMAIL HERE
deadline_hours: 0.25
warn_hours_before: [0.0833, 0.0333]
check_interval_minutes: 0.5
exclude_poster: false   # so you get pinged about your own test post
db_path: test.db
